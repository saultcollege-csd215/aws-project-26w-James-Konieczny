name: EC2 Deployment

on:
    workflow_dispatch:

jobs:
    deploy_ec2:
        runs-on: ubuntu-latest

        steps:
          - name: Checkout the code
            uses: actions/checkout@v6
            with:
                ref: aws-project
        
          - name: SSH into EC2 instance and run deploy script
            uses: appleboy/ssh-action@v1
            with:
                host: 3.235.240.234
                username: ec2-user
                key: ${{ secrets.EC2_KEY }}
                script_path: resources/deploy_ec2.sh
